<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UAE Mulkiya Reader</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">LOCAL + AWS READY</div>
        <h1>UAE Mulkiya Reader</h1>
        <p>Upload UAE vehicle licenses and extract the exact fields required by your system.</p>
      </div>
      <div class="status" id="statusBadge">
        <span class="status-dot"></span>
        <span>Checking service…</span>
      </div>
    </header>

    <section class="upload-card">
      <div id="dropZone" class="drop-zone" tabindex="0">
        <div class="upload-icon">↑</div>
        <h2>Drop Mulkiya files here</h2>
        <p>JPG, JPEG, PNG, WEBP or PDF · up to 20 files</p>
        <button type="button" class="secondary" id="chooseButton">Choose files</button>
        <input id="fileInput" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.pdf,image/*,application/pdf" hidden />
      </div>

      <div class="queue" id="queue" hidden>
        <div class="queue-head">
          <div>
            <h3>Files ready</h3>
            <span id="queueCount"></span>
          </div>
          <button type="button" class="text-button" id="clearButton">Clear all</button>
        </div>
        <div id="fileList" class="file-list"></div>
        <button type="button" class="primary" id="extractButton">
          <span id="extractButtonText">Extract information</span>
          <span class="spinner" id="spinner" hidden></span>
        </button>
      </div>
    </section>

    <section id="resultsSection" class="results-section" hidden>
      <div class="section-title-row">
        <div>
          <div class="eyebrow">RESULTS</div>
          <h2>Extracted vehicle data</h2>
        </div>
        <div id="totalTiming" class="timing"></div>
      </div>
      <div id="results" class="results"></div>
    </section>
  </main>

  <template id="resultTemplate">
    <article class="result-card">
      <div class="result-head">
        <div class="result-file">
          <div class="file-badge">M</div>
          <div>
            <h3 class="result-filename"></h3>
            <p class="result-meta"></p>
          </div>
        </div>
        <div class="result-actions">
          <button type="button" class="secondary small copy-json">Copy JSON</button>
          <button type="button" class="secondary small toggle-json">View JSON</button>
          <button type="button" class="secondary small toggle-ocr" hidden>Raw OCR</button>
        </div>
      </div>

      <div class="warning-box" hidden></div>

      <div class="field-groups">
        <section class="field-group">
          <h4>Plate & VIN</h4>
          <div class="field-grid">
            <div class="field"><label>Plate Source</label><div data-field="plate_source"></div></div>
            <div class="field"><label>Plate Category</label><div data-field="plate_category"></div></div>
            <div class="field"><label>Plate Code</label><div data-field="plate_code"></div></div>
            <div class="field"><label>Plate Number</label><div data-field="plate_number"></div></div>
            <div class="field full"><label>VIN</label><div data-field="vin" class="mono"></div></div>
          </div>
        </section>

        <section class="field-group">
          <h4>Vehicle Details</h4>
          <div class="field-grid">
            <div class="field"><label>Make</label><div data-field="make"></div></div>
            <div class="field"><label>Model</label><div data-field="model"></div></div>
            <div class="field"><label>Year</label><div data-field="year"></div></div>
            <div class="field"><label>Color</label><div data-field="color"></div></div>
          </div>
        </section>

        <section class="field-group">
          <h4>Service & Expiry</h4>
          <div class="field-grid">
            <div class="field full"><label>Insurance Company</label><div data-field="insurance_company"></div></div>
            <div class="field"><label>Policy Number</label><div data-field="policy_number" class="mono"></div></div>
            <div class="field"><label>Insurance Expiry</label><div data-field="insurance_expiry"></div></div>
            <div class="field"><label>Registration Expiry</label><div data-field="registration_expiry"></div></div>
            <div class="field"><label>Registration Issuance</label><div data-field="registration_issuance"></div></div>
          </div>
        </section>
      </div>

      <div class="json-panel" hidden>
        <div class="json-title">API JSON</div>
        <pre></pre>
      </div>

      <div class="ocr-panel" hidden>
        <div class="json-title">Raw OCR &mdash; every detected line, in reading order</div>
        <div class="ocr-scroll">
          <table class="ocr-table">
            <thead><tr><th>y</th><th>x</th><th>Lang</th><th>Conf</th><th>Text</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
